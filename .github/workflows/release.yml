name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: x86_64
          - arch: aarch64
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (arm64 build)
        if: matrix.arch == 'aarch64'
        uses: docker/setup-qemu-action@v3

      - name: Build binary (linux-${{ matrix.arch }})
        run: |
          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            # Cross-build under qemu using an arm64 python container
            docker run --rm --platform linux/arm64 -v "$PWD":/work -w /work \
              python:3.12-slim bash -c "apt-get update -qq && apt-get install -y -qq binutils && \
                pip install pyinstaller rich && \
                pyinstaller --onefile --name fenox \
                  --distpath dist/linux/aarch64 --workpath /tmp/build \
                  --specpath /tmp src/fenox.py"
          else
            pip install pyinstaller rich
            pyinstaller --onefile --name fenox \
              --distpath dist/linux/x86_64 --workpath build --specpath /tmp \
              src/fenox.py
          fi

      - name: Verify binary runs
        run: |
          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            # arm64 binaries can't exec on the x86_64 host directly — verify inside the container
            docker run --rm --platform linux/arm64 -v "$PWD":/work -w /work \
              python:3.12-slim bash -c "dist/linux/aarch64/fenox --version && dist/linux/aarch64/fenox --help > /dev/null && echo OK"
          else
            BIN=dist/linux/${{ matrix.arch }}/fenox
            $BIN --version
            $BIN --help > /dev/null
          fi

      - name: Rename with platform suffix + checksum
        run: |
          sudo chown -R "$(id -u):$(id -g)" dist || true   # docker wrote files as root
          cd dist/linux/${{ matrix.arch }}
          mv fenox fenox-linux-${{ matrix.arch }}
          sha256sum fenox-linux-${{ matrix.arch }} > fenox-linux-${{ matrix.arch }}.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: fenox-linux-${{ matrix.arch }}
          path: dist/linux/${{ matrix.arch }}/*

  e2e:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          name: fenox-linux-x86_64
          path: release-bin

      - name: Make the published binary executable
        run: chmod +x release-bin/fenox-linux-x86_64

      # Proves the shipped artifact actually installs through install.sh: one-liner
      # path, clone path, .sha256 fallback, and refusal on a tampered download.
      - name: End-to-end install test against the real artifact
        run: bash tests/test_release_e2e.sh release-bin/fenox-linux-x86_64

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage release files
        run: |
          cp artifacts/fenox-linux-x86_64/fenox-linux-x86_64 .
          cp artifacts/fenox-linux-x86_64/fenox-linux-x86_64.sha256 .
          cp artifacts/fenox-linux-aarch64/fenox-linux-aarch64 .
          cp artifacts/fenox-linux-aarch64/fenox-linux-aarch64.sha256 .
          cat fenox-linux-*.sha256 > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            fenox-linux-x86_64
            fenox-linux-x86_64.sha256
            fenox-linux-aarch64
            fenox-linux-aarch64.sha256
            SHA256SUMS
