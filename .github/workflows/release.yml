name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: x86_64
          - arch: aarch64
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (arm64 build)
        if: matrix.arch == 'aarch64'
        uses: docker/setup-qemu-action@v3

      - name: Build binary (linux-${{ matrix.arch }})
        run: |
          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            # Cross-build under qemu using an arm64 python container
            docker run --rm --platform linux/arm64 -v "$PWD":/work -w /work \
              python:3.12-slim bash -c "apt-get update -qq && apt-get install -y -qq binutils && \
                pip install pyinstaller rich && \
                pyinstaller --onefile --name fenox-mobile \
                  --distpath dist/linux/aarch64 --workpath /tmp/build \
                  --specpath /tmp src/fenox_mobile_source.py"
          else
            pip install pyinstaller rich
            pyinstaller --onefile --name fenox-mobile \
              --distpath dist/linux/x86_64 --workpath build --specpath /tmp \
              src/fenox_mobile_source.py
          fi

      - name: Verify binary runs
        run: |
          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            # arm64 binaries can't exec on the x86_64 host directly — verify inside the container
            docker run --rm --platform linux/arm64 -v "$PWD":/work -w /work \
              python:3.12-slim bash -c "dist/linux/aarch64/fenox-mobile --version && dist/linux/aarch64/fenox-mobile --help > /dev/null && echo OK"
          else
            BIN=dist/linux/${{ matrix.arch }}/fenox-mobile
            $BIN --version
            $BIN --help > /dev/null
          fi

      - name: Rename with platform suffix + checksum
        run: |
          sudo chown -R "$(id -u):$(id -g)" dist || true   # docker wrote files as root
          cd dist/linux/${{ matrix.arch }}
          mv fenox-mobile fenox-mobile-linux-${{ matrix.arch }}
          sha256sum fenox-mobile-linux-${{ matrix.arch }} > fenox-mobile-linux-${{ matrix.arch }}.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: fenox-mobile-linux-${{ matrix.arch }}
          path: dist/linux/${{ matrix.arch }}/*

  e2e:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          name: fenox-mobile-linux-x86_64
          path: release-bin

      - name: Make the published binary executable
        run: chmod +x release-bin/fenox-mobile-linux-x86_64

      # Proves the shipped artifact actually installs through install.sh: one-liner
      # path, clone path, .sha256 fallback, and refusal on a tampered download.
      - name: End-to-end install test against the real artifact
        run: bash tests/test_release_e2e.sh release-bin/fenox-mobile-linux-x86_64

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate install.ps1 syntax
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          Write-Host "install.ps1 parses cleanly"

      - name: Build binary (windows-x86_64)
        run: |
          pip install pyinstaller rich
          pyinstaller --onefile --name fenox-mobile `
            --distpath dist/windows/x86_64 --workpath build --specpath ${{ runner.temp }} `
            src/fenox_mobile_source.py

      - name: Verify binary runs
        run: dist/windows/x86_64/fenox-mobile.exe --version

      - name: Rename with platform suffix + checksum
        shell: pwsh
        run: |
          $dir = "dist/windows/x86_64"
          $name = "fenox-mobile-windows-x86_64.exe"
          Rename-Item "$dir/fenox-mobile.exe" $name
          $hash = (Get-FileHash "$dir/$name" -Algorithm SHA256).Hash.ToLower()
          # LF line endings, matching sha256sum output so SHA256SUMS stays consistent
          [System.IO.File]::WriteAllText("$dir/$name.sha256", "$hash  $name`n")
          Get-Content "$dir/$name.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: fenox-mobile-windows-x86_64
          path: dist/windows/x86_64/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, e2e, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage release files
        run: |
          cp artifacts/fenox-mobile-linux-x86_64/fenox-mobile-linux-x86_64 .
          cp artifacts/fenox-mobile-linux-x86_64/fenox-mobile-linux-x86_64.sha256 .
          cp artifacts/fenox-mobile-linux-aarch64/fenox-mobile-linux-aarch64 .
          cp artifacts/fenox-mobile-linux-aarch64/fenox-mobile-linux-aarch64.sha256 .
          cp artifacts/fenox-mobile-windows-x86_64/fenox-mobile-windows-x86_64.exe .
          cp artifacts/fenox-mobile-windows-x86_64/fenox-mobile-windows-x86_64.exe.sha256 .
          cat fenox-mobile-linux-*.sha256 fenox-mobile-windows-*.sha256 > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            fenox-mobile-linux-x86_64
            fenox-mobile-linux-x86_64.sha256
            fenox-mobile-linux-aarch64
            fenox-mobile-linux-aarch64.sha256
            fenox-mobile-windows-x86_64.exe
            fenox-mobile-windows-x86_64.exe.sha256
            SHA256SUMS
